<!doctype html><html lang="th"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+Thai:wght@300;400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_book.css">
<style>
.page{display:flex;flex-direction:column}
.manifesto{margin-top:56px;display:grid;grid-template-columns:1fr;gap:0;max-width:660px}
.line{display:flex;align-items:baseline;gap:26px;padding:26px 0;border-bottom:1px solid var(--rule)}
.line:first-child{border-top:1px solid var(--rule)}
.line .k{font-family:var(--serif-th);font-weight:400;color:var(--navy);
  font-size:30px;line-height:1.4;width:180px;flex:none}
.line .v{font-family:var(--sans-th);font-weight:300;color:#3A3A3A;font-size:18px}
.close{margin-top:56px;max-width:52ch}
.detail{position:absolute;right:-20px;bottom:130px;width:520px;opacity:.96}
.sign{margin-top:auto;display:flex;align-items:flex-end;gap:22px}
.sign .mark{font-size:56px}
</style></head><body>
<div class="page">
  <p class="eyebrow">Idea</p>
  <h2>แนวคิดของ POH</h2>

  <div class="manifesto">
    <div class="line"><span class="k">อดีต</span><span class="v">คือรากเหง้า</span></div>
    <div class="line"><span class="k">ทะเล</span><span class="v">คือเส้นทาง</span></div>
    <div class="line"><span class="k">ดาหลา</span><span class="v">คือการผลิบาน</span></div>
    <div class="line"><span class="k">สีชมพู</span><span class="v">คือสีสันของวันนี้</span></div>
  </div>

  <p class="close">POH ไม่ได้พาเราย้อนกลับไปหาอดีต แต่ชวนให้มองเห็นว่า
    เมืองที่มีรากแข็งแรง สามารถผลิบานเป็นสิ่งใหม่ได้เสมอ</p>

  <img class="detail" src="assets/detail.png" alt="">

  <div class="sign">
    <span class="mark">POH</span><span class="bar" style="width:1px;height:38px;background:var(--rule);margin-bottom:6px"></span>
    <span class="mark-sm" style="margin-bottom:10px">Sparkling Tea</span>
  </div>

  <div class="footline"><span>Poh · Brand Story</span><span>04</span></div>
</div>
</body></html>
