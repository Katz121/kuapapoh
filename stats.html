<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สถิติคนเข้าเว็บ · กั่วป่าโพ้</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FFE81C;--red:#F4331F;--magenta:#EC0A72;--paper:#FBF7EC;--ink:#101538;--muted:#4d5474;--rule:rgba(16,21,56,.16);--ok:#0d7a4a;
--display:'Bai Jamjuree','IBM Plex Sans Thai',sans-serif;--body:'IBM Plex Sans Thai',sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:#fff;padding:14px 0}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--display);font-size:1.1rem;margin:0}
header a{color:var(--yellow)}
main{padding:20px 0 60px}
.gate{max-width:380px;margin:60px auto;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:20px}
input,select{font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
button{font:inherit;font-weight:600;border:0;border-radius:99px;padding:.6rem 1.1rem;background:var(--ink);color:#fff;cursor:pointer}
h2{font-family:var(--display);font-size:1.05rem;margin:26px 0 10px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px}
.card b{display:block;font-family:var(--display);font-size:1.6rem}
.card small{color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar select{width:auto}
.note{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:14px;margin-bottom:18px}
.note b{font-family:var(--display)}
.err{background:#ffeceb;border:2px solid var(--red);color:#8e1a0c;border-radius:10px;padding:10px 12px;margin-bottom:14px}
.table-wrap{overflow-x:auto;border:2px solid var(--ink);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--rule);font-size:.9rem}
th{background:var(--yellow);font-family:var(--display);font-size:.86rem}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.step{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;margin-bottom:8px}
.bar{background:#fff;border:2px solid var(--ink);border-radius:99px;height:26px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--magenta)}
.step small{color:var(--muted)}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
[hidden]{display:none !important}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>สถิติคนเข้าเว็บ · กั่วป่าโพ้</h1>
  <a href="/preorder-admin.html">→ หน้าจัดการพรีออเดอร์</a>
</div></header>

<main class="wrap">
  <section class="gate" id="gate">
    <h2 style="margin-top:0">ใส่รหัสผ่านทีมงาน</h2>
    <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password">
    <p class="err" id="gate-msg" hidden></p>
    <p><button id="enter">เข้าดูสถิติ</button></p>
  </section>

  <section id="panel" hidden>
    <div class="toolbar">
      <label for="days">ช่วงเวลา</label>
      <select id="days">
        <option value="7">7 วันล่าสุด</option>
        <option value="30" selected>30 วันล่าสุด</option>
        <option value="90">90 วันล่าสุด</option>
        <option value="365">1 ปี</option>
      </select>
      <button id="reload" class="ghost" style="background:transparent;color:var(--ink);border:2px solid var(--ink)">โหลดใหม่</button>
    </div>

    <p class="err" id="msg" hidden></p>

    <div class="cards" id="cards"></div>

    <h2>ทางเดินของลูกค้า</h2>
    <div id="funnel"></div>

    <div class="note" id="metanote"></div>

    <div class="grid2">
      <div>
        <h2>หน้าที่คนเปิดมากสุด</h2>
        <div class="table-wrap"><table id="pages"></table></div>
      </div>
      <div>
        <h2>คนมาจากไหน</h2>
        <div class="table-wrap"><table id="sources"></table></div>
      </div>
    </div>

    <h2>รายวัน</h2>
    <div class="table-wrap"><table id="daily"></table></div>

    <h2>เปิดจากแอปอะไร</h2>
    <div class="table-wrap"><table id="browsers"></table></div>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = sessionStorage.getItem('kp_admin_token') || '';

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function num(value) { return Number(value || 0).toLocaleString('th-TH'); }

  function load(fromGate) {
    fetch('/api/admin/visits?days=' + $('days').value, { headers: { 'x-admin-token': token } })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'ระบบตอบกลับผิดพลาด' }; }); })
      .then(function (data) {
        if (!data.ok) {
          var box = fromGate ? $('gate-msg') : $('msg');
          box.hidden = false; box.textContent = data.error;
          return;
        }
        sessionStorage.setItem('kp_admin_token', token);
        $('gate').hidden = true; $('panel').hidden = false; $('msg').hidden = true;
        render(data);
      });
  }

  function render(data) {
    var t = data.totals || {};
    var purchase = t.Purchase || { people: 0, hits: 0, value: 0 };
    var pageview = t.PageView || { people: 0, hits: 0 };
    $('cards').innerHTML = [
      card(num(pageview.people), 'คนที่เข้าเว็บ', 'นับหัว ไม่นับรีเฟรช'),
      card(num(pageview.hits), 'จำนวนครั้งที่เปิดหน้า', ''),
      card(num(purchase.hits), 'ออเดอร์ที่สั่งสำเร็จ', ''),
      card(num(purchase.value) + ' บาท', 'ยอดรวมที่สั่งเข้ามา', 'รวมค่าส่ง'),
    ].join('');

    $('funnel').innerHTML = (data.funnel || []).map(function (step) {
      return '<div class="step"><div>' + esc(step.label) + '</div>' +
        '<div class="bar"><span style="width:' + Math.max(step.rate, step.people ? 2 : 0) + '%"></span></div>' +
        '<small>' + num(step.people) + ' คน · ' + step.rate + '%</small></div>';
    }).join('');

    var meta = data.meta || {};
    $('metanote').innerHTML = '<b>เตรียมไว้ให้ Meta แล้ว</b><br>' +
      'เก็บไว้ทั้งหมด ' + num(meta.allRows) + ' รายการ · ยังไม่ได้ส่งเข้า Meta ' + num(meta.pending) + ' รายการ · ' +
      'ในนั้นมีรหัสติดตามจากเฟซบุ๊ก (fbclid) ' + num(meta.withFbclid) + ' รายการ<br>' +
      '<small>วันที่สร้าง Pixel แล้ว ข้อมูลชุดนี้ส่งย้อนเข้า Meta ผ่าน Conversions API ได้ ' +
      'โดยไม่ถูกนับซ้ำ เพราะทุกรายการมีเลขกำกับของตัวเอง</small>';

    $('pages').innerHTML = table(['หน้า', 'ครั้ง', 'คน'], (data.topPages || []).map(function (row) {
      return [esc(row.path || '/'), num(row.hits), num(row.people)];
    }));
    $('sources').innerHTML = table(['มาจาก', 'ครั้ง', 'คน'], (data.topSources || []).map(function (row) {
      return [esc(row.src), num(row.hits), num(row.people)];
    }));
    $('browsers').innerHTML = table(['แอป/เบราว์เซอร์', 'คน'], (data.browsers || []).map(function (row) {
      return [esc(row.ua), num(row.people)];
    }));

    // รวมรายวันให้อยู่บรรทัดเดียวกันทุกชนิดเหตุการณ์ จะได้อ่านเทียบกันได้
    var byDay = {};
    (data.byDay || []).forEach(function (row) {
      byDay[row.day] = byDay[row.day] || {};
      byDay[row.day][row.event] = row.people;
    });
    var days = Object.keys(byDay).sort().reverse();
    $('daily').innerHTML = table(['วัน', 'เข้าเว็บ', 'ดูเสื้อ', 'เลือกไซส์', 'เริ่มกรอก', 'สั่งสำเร็จ'],
      days.map(function (day) {
        var d = byDay[day];
        return [esc(day), num(d.PageView), num(d.ViewContent), num(d.AddToCart),
                num(d.InitiateCheckout), num(d.Purchase)];
      }));
  }

  function card(big, label, hint) {
    return '<div class="card"><b>' + esc(big) + '</b>' + esc(label) +
      (hint ? '<br><small>' + esc(hint) + '</small>' : '') + '</div>';
  }
  function table(head, rows) {
    if (!rows.length) return '<tr><td>ยังไม่มีข้อมูลในช่วงนี้</td></tr>';
    return '<tr>' + head.map(function (h, i) {
      return '<th' + (i ? ' style="text-align:right"' : '') + '>' + esc(h) + '</th>';
    }).join('') + '</tr>' + rows.map(function (cells) {
      return '<tr>' + cells.map(function (cell, i) {
        return i ? '<td class="num">' + cell + '</td>' : '<td>' + cell + '</td>';
      }).join('') + '</tr>';
    }).join('');
  }

  $('enter').addEventListener('click', function () {
    token = $('token').value.trim();
    if (!token) { $('gate-msg').hidden = false; $('gate-msg').textContent = 'ใส่รหัสก่อนนะครับ'; return; }
    $('gate-msg').hidden = true;
    load(true);
  });
  $('token').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('enter').click(); });
  $('reload').addEventListener('click', function () { load(false); });
  $('days').addEventListener('change', function () { load(false); });

  if (token) load(true);
})();
</script>
</body>
</html>
