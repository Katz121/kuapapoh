<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- p-peranakan: Peranakan floral tile motif -->
  <symbol id="p-peranakan" viewBox="0 0 200 200">
    <!-- Outer frame border (12px line along boundary) -->
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="currentColor" stroke-width="12"/>
    <!-- Inner frame border -->
    <rect x="24" y="24" width="152" height="152" fill="none" stroke="currentColor" stroke-width="6"/>
    <!-- Center pistil -->
    <circle cx="100" cy="100" r="16" fill="currentColor"/>
    <circle cx="100" cy="100" r="24" fill="none" stroke="currentColor" stroke-width="4"/>
    <!-- 4 Cardinal Petals -->
    <path d="M 100 76 C 72 65 72 38 100 38 C 128 38 128 65 100 76 Z" fill="currentColor"/>
    <path d="M 100 124 C 72 135 72 162 100 162 C 128 162 128 135 100 124 Z" fill="currentColor"/>
    <path d="M 76 100 C 65 72 38 72 38 100 C 38 128 65 128 76 100 Z" fill="currentColor"/>
    <path d="M 124 100 C 135 72 162 72 162 100 C 162 128 135 128 124 100 Z" fill="currentColor"/>
    <!-- Inner Corner Leaves -->
    <path d="M 24 50 C 45 50 50 45 50 24 C 34 24 24 34 24 50 Z" fill="currentColor"/>
    <path d="M 176 50 C 155 50 150 45 150 24 C 166 24 176 34 176 50 Z" fill="currentColor"/>
    <path d="M 24 150 C 45 150 50 155 50 176 C 34 176 24 166 24 150 Z" fill="currentColor"/>
    <path d="M 176 150 C 155 150 150 155 150 176 C 166 176 176 166 176 150 Z" fill="currentColor"/>
    <!-- Outer Tile Vertex Corner Diamonds (Combine across 4 tiles into a 32x32 star) -->
    <path d="M 0 16 L 6 6 L 16 0 L 0 0 Z" fill="currentColor"/>
    <path d="M 200 16 L 194 6 L 184 0 L 200 0 Z" fill="currentColor"/>
    <path d="M 0 184 L 6 194 L 16 200 L 0 200 Z" fill="currentColor"/>
    <path d="M 200 184 L 194 194 L 184 200 L 200 200 Z" fill="currentColor"/>
  </symbol>

  <!-- p-pixelcheck: Chunky pixel checkerboard with missing squares for hand-set look -->
  <symbol id="p-pixelcheck" viewBox="0 0 200 200">
    <!-- Row 0 (y=0..25) -->
    <rect x="0" y="0" width="25" height="25" fill="currentColor"/>
    <rect x="50" y="0" width="25" height="25" fill="currentColor"/>
    <rect x="100" y="0" width="25" height="25" fill="currentColor"/>
    <rect x="150" y="0" width="25" height="25" fill="currentColor"/>
    <!-- Row 1 (y=25..50) -->
    <rect x="25" y="25" width="25" height="25" fill="currentColor"/>
    <!-- x=75 y=25 missing -->
    <rect x="125" y="25" width="25" height="25" fill="currentColor"/>
    <rect x="175" y="25" width="25" height="25" fill="currentColor"/>
    <!-- Row 2 (y=50..75) -->
    <rect x="0" y="50" width="25" height="25" fill="currentColor"/>
    <rect x="50" y="50" width="25" height="25" fill="currentColor"/>
    <rect x="100" y="50" width="25" height="25" fill="currentColor"/>
    <!-- x=150 y=50 missing -->
    <!-- Row 3 (y=75..100) -->
    <rect x="25" y="75" width="25" height="25" fill="currentColor"/>
    <rect x="75" y="75" width="25" height="25" fill="currentColor"/>
    <rect x="125" y="75" width="25" height="25" fill="currentColor"/>
    <rect x="175" y="75" width="25" height="25" fill="currentColor"/>
    <!-- Row 4 (y=100..125) -->
    <rect x="0" y="100" width="25" height="25" fill="currentColor"/>
    <!-- x=50 y=100 missing -->
    <rect x="100" y="100" width="25" height="25" fill="currentColor"/>
    <rect x="150" y="100" width="25" height="25" fill="currentColor"/>
    <!-- Row 5 (y=125..150) -->
    <rect x="25" y="125" width="25" height="25" fill="currentColor"/>
    <rect x="75" y="125" width="25" height="25" fill="currentColor"/>
    <!-- x=125 y=125 missing -->
    <rect x="175" y="125" width="25" height="25" fill="currentColor"/>
    <!-- Row 6 (y=150..175) -->
    <!-- x=0 y=150 missing -->
    <rect x="50" y="150" width="25" height="25" fill="currentColor"/>
    <rect x="100" y="150" width="25" height="25" fill="currentColor"/>
    <rect x="150" y="150" width="25" height="25" fill="currentColor"/>
    <!-- Row 7 (y=175..200) -->
    <rect x="25" y="175" width="25" height="25" fill="currentColor"/>
    <rect x="75" y="175" width="25" height="25" fill="currentColor"/>
    <rect x="125" y="175" width="25" height="25" fill="currentColor"/>
    <rect x="175" y="175" width="25" height="25" fill="currentColor"/>
  </symbol>

  <!-- p-arcadearch: Repeating arched shophouse arcade openings (five foot way / Ngo Kak Kee) -->
  <symbol id="p-arcadearch" viewBox="0 0 200 200">
    <!-- Row 1 (y=0..100): 2 Arches -->
    <!-- Arch 1 Outer & Inner Ring fill -->
    <path d="M 8 48 A 42 42 0 0 1 92 48 L 92 90 H 76 L 76 48 A 26 26 0 0 0 24 48 L 24 90 H 8 Z" fill="currentColor"/>
    <!-- Arch 2 Outer & Inner Ring fill -->
    <path d="M 108 48 A 42 42 0 0 1 192 48 L 192 90 H 176 L 176 48 A 26 26 0 0 0 124 48 L 124 90 H 108 Z" fill="currentColor"/>
    <!-- Piers (Left half x=0..8, Center x=92..108, Right half x=192..200) -->
    <rect x="0" y="0" width="8" height="90" fill="currentColor"/>
    <rect x="92" y="0" width="16" height="90" fill="currentColor"/>
    <rect x="192" y="0" width="8" height="90" fill="currentColor"/>
    <!-- Impost Capitals -->
    <rect x="0" y="44" width="12" height="4" fill="currentColor"/>
    <rect x="88" y="44" width="24" height="4" fill="currentColor"/>
    <rect x="188" y="44" width="12" height="4" fill="currentColor"/>
    <!-- Keystones -->
    <rect x="44" y="2" width="12" height="10" fill="currentColor"/>
    <rect x="144" y="2" width="12" height="10" fill="currentColor"/>
    <!-- Fanlight transom arcs -->
    <path d="M 36 48 A 14 14 0 0 1 64 48" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M 136 48 A 14 14 0 0 1 164 48" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="50" y1="48" x2="50" y2="34" stroke="currentColor" stroke-width="3"/>
    <line x1="150" y1="48" x2="150" y2="34" stroke="currentColor" stroke-width="3"/>
    <!-- Row 1 Transom Beam -->
    <rect x="0" y="90" width="200" height="10" fill="currentColor"/>

    <!-- Row 2 (y=100..200): 2 Arches -->
    <!-- Arch 1 Outer & Inner Ring fill -->
    <path d="M 8 148 A 42 42 0 0 1 92 148 L 92 190 H 76 L 76 148 A 26 26 0 0 0 24 148 L 24 190 H 8 Z" fill="currentColor"/>
    <!-- Arch 2 Outer & Inner Ring fill -->
    <path d="M 108 148 A 42 42 0 0 1 192 148 L 192 190 H 176 L 176 148 A 26 26 0 0 0 124 148 L 124 190 H 108 Z" fill="currentColor"/>
    <!-- Piers -->
    <rect x="0" y="100" width="8" height="90" fill="currentColor"/>
    <rect x="92" y="100" width="16" height="90" fill="currentColor"/>
    <rect x="192" y="100" width="8" height="90" fill="currentColor"/>
    <!-- Impost Capitals -->
    <rect x="0" y="144" width="12" height="4" fill="currentColor"/>
    <rect x="88" y="144" width="24" height="4" fill="currentColor"/>
    <rect x="188" y="144" width="12" height="4" fill="currentColor"/>
    <!-- Keystones -->
    <rect x="44" y="102" width="12" height="10" fill="currentColor"/>
    <rect x="144" y="102" width="12" height="10" fill="currentColor"/>
    <!-- Fanlight transom arcs -->
    <path d="M 36 148 A 14 14 0 0 1 64 148" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M 136 148 A 14 14 0 0 1 164 148" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="50" y1="148" x2="50" y2="134" stroke="currentColor" stroke-width="3"/>
    <line x1="150" y1="148" x2="150" y2="134" stroke="currentColor" stroke-width="3"/>
    <!-- Row 2 Transom Beam -->
    <rect x="0" y="190" width="200" height="10" fill="currentColor"/>
  </symbol>

  <!-- p-wavelet: Tight wave line repeat -->
  <symbol id="p-wavelet" viewBox="0 0 200 200">
    <path d="
      M 0 12.5 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0
      M 0 37.5 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0
      M 0 62.5 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0
      M 0 87.5 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0
      M 0 112.5 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0
      M 0 137.5 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0
      M 0 162.5 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0
      M 0 187.5 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0 c 6.25 9.6, 18.75 9.6, 25 0 c 6.25 -9.6, 18.75 -9.6, 25 0
    " fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
