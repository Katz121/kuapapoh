<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ไม่พบหน้าที่คุณต้องการ | กั่วป่าโพ้ · Kuapapoh</title>

<style>
:root{
  --yellow:#FFE81C;
  --magenta:#EC0A72;
  --magenta-text:#C4005D;
  --cobalt:#1E3FA8;
  --red:#F4331F;
  --paper:#FBF7EC;
  --ink:#101538;
  --muted:#4d5474;
  --rule:rgba(16,21,56,.16);

  --display:'Bai Jamjuree','IBM Plex Sans Thai',sans-serif;
  --body:'IBM Plex Sans Thai','Noto Sans Thai',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;

  --pad:clamp(20px,5vw,68px);
  --maxw:1200px;
  --measure:62ch;
  --bar:52px;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-weight:400;font-size:clamp(16px,1.05vw,17px);line-height:1.75;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  display:flex;flex-direction:column;min-height:100vh;
}
a{color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad)}

/* topbar */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:90;
  background:var(--paper);border-bottom:2px solid var(--ink)}
.topbar .wrap{display:flex;align-items:center;height:100%;gap:1.5rem}
.topbar b{font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--cobalt);flex:none}
.topbar nav{display:flex;align-items:center;gap:clamp(1rem,2.2vw,1.6rem);font-size:.9rem;font-weight:500;
  overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(to right,#000 90%,transparent)}
.topbar nav::-webkit-scrollbar{display:none}
.topbar a{text-decoration:none;white-space:nowrap;padding-block:.4rem}
.topbar a:hover{color:var(--magenta-text)}

/* error content */
.error-page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 20px;text-align:center;}
.error-page h1{font-family:var(--display);font-weight:700;font-size:clamp(3rem,8vw,6rem);color:var(--magenta);margin:0;line-height:1;}
.error-page p{font-size:clamp(1.1rem,2vw,1.3rem);margin:1rem 0 2rem;}
.btn{display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--body);font-weight:600;font-size:.95rem;text-decoration:none;
  background:var(--cobalt);color:#fff;padding:.65em 1.25em;border-radius:4px;
  border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:6px 6px 0 var(--ink)}
.btn-outline{background:#fff;color:var(--ink)}

/* footer */
footer{background:var(--ink);color:#a9aecb;padding:2.2rem 0;font-size:.86rem;margin-top:auto;}
footer .wrap{display:grid;gap:1rem}
footer b{font-family:var(--display);color:var(--paper);font-size:1.05rem;font-weight:700;display:block;margin-bottom:.3rem}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <b>กั่วป่าโพ้</b>
    <nav aria-label="เมนูหลัก">
      <a href="/">หน้าแรก</a>
      <a href="/en/" lang="en" hreflang="en">EN</a>
    </nav>
  </div>
</div>

<main class="error-page">
  <h1>404</h1>
  <p>ไม่พบหน้าที่คุณต้องการ<br>Page Not Found</p>
  <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
    <a href="/" class="btn">กลับหน้าแรก</a>
    <a href="/en/" class="btn btn-outline" lang="en">Go to English Homepage</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <div>
      <b>กั่วป่าโพ้ จีโชว์เมือง</b>
      ภายใต้โครงการ Creative Cultural District (CCD) · สนับสนุนและดำเนินงานโดยสำนักงานส่งเสริมเศรษฐกิจสร้างสรรค์ (CEA)
    </div>
  </div>
</footer>

</body>
</html>
